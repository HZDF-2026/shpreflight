[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shpreflight"
version = "0.2.0"
description = "Pre-flight diagnostics for shell commands generated by AI agents: dialect compatibility, missing tools, destructive operations — before the command runs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "HZDF" }]
keywords = ["ai-agents", "shell", "powershell", "portability", "preflight", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Shells",
]

[project.scripts]
shpreflight = "shpreflight.cli:main"

[tool.setuptools.packages.find]
include = ["shpreflight*"]
