[package]
name = "shpreflight"
version = "0.2.0"
edition = "2021"
description = "Pre-flight diagnostics for shell commands generated by AI agents: dialect compatibility, missing tools, destructive operations — before the command runs."
license = "MIT"
authors = ["HZDF"]

[lib]
name = "shpreflight"
path = "src/lib.rs"

[[bin]]
name = "shpreflight"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
